<!--
  Supabase → Invite user
  Subject: You’re invited — Circe et Venus

  Paste everything after this comment into Message.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />

<style type="text/css">
  .cetv-body { font-family: 'DM Sans', -apple-system, sans-serif !important; }
  .cetv-title { font-family: 'Cinzel', Georgia, serif !important; }
</style>
<table role="presentation" width="100%" bgcolor="#f5f5f7" cellpadding="0" cellspacing="0"><tr>
  <td align="center" style="padding:52px 20px;">
    <table role="presentation" width="600" style="width:100%;max-width:600px;"><tr><td bgcolor="#ffffff" style="border-radius:22px;border:1px solid #d8d8dd;box-shadow:0 6px 20px rgba(0,0,0,0.04);overflow:hidden;">
      <table width="100%"><tr><td bgcolor="#5c4dbf" height="3" style="height:3px;"></td></tr></table>
      <table width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:40px 44px 8px;"><img src="https://www.circeetvenus.com/icon.png" width="48" height="48" style="border-radius:999px;" alt="" /></td></tr>
        <tr><td style="padding:6px 44px 0;"><h1 class="cetv-title" style="margin:0;font-size:26px;font-weight:600;color:#1d1d1f;font-family:'Cinzel',Georgia,serif;line-height:1.12;">Invitation</h1>
          <p style="margin:18px 0 0;font-size:17px;line-height:26px;color:#494949;font-family:'DM Sans',sans-serif;">You’re invited to Circe et Venus.</p>
          {{ if .Email }}<p style="margin:10px 0 0;font-size:15px;line-height:23px;color:#6e6e73;font-weight:400;word-break:break-all;font-family:'DM Sans',sans-serif;">{{ .Email }}</p>{{ end }}
          {{ if .SiteURL }}<p style="margin:16px 0 0;font-size:14px;color:#86868b;line-height:21px;">{{ .SiteURL }}</p>{{ end }}
        </td></tr>
        <tr><td style="padding:34px 44px;text-align:center;"><table align="center" cellpadding="0" cellspacing="0"><tr>
          <td bgcolor="#1d1d1f" style="border-radius:999px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 32px;font-family:'DM Sans',sans-serif;font-weight:600;font-size:16px;color:#ffffff;text-decoration:none;border-radius:999px;">Accept</a></td>
        </tr></table></td></tr>
        <tr><td style="padding:0 44px 42px;">
          <table width="100%"><tr><td style="border-top:1px solid #ececec;"></td></tr></table>
          <p style="margin:24px 0 0;font-size:12px;color:#aeaeb2;line-height:17px;word-break:break-all;">{{ .ConfirmationURL }}</p>
          <p style="margin:20px 0 0;font-size:13px;color:#86868b;line-height:20px;">Unexpected? Ignore.</p>
        </td></tr>
      </table>
    </td></tr></table>
  </td>
</tr></table>
