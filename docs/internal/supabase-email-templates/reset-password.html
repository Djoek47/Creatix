<!--
  Supabase → Reset password
  Subject: Reset your password — Circe et Venus

  Paste everything after this comment into Message.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />

<style type="text/css">
  .cetv-body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif !important; }
  .cetv-title { font-family: 'Cinzel', Georgia, serif !important; letter-spacing: -0.025em !important; }
</style>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="#f5f5f7" style="background-color:#f5f5f7;">
  <tr>
    <td align="center" style="padding:52px 20px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:100%;max-width:600px;">
        <tr>
          <td bgcolor="#ffffff" style="border-radius:22px;border:1px solid #d8d8dd;box-shadow:0 6px 20px rgba(0,0,0,0.04);overflow:hidden;">
            <table width="100%"><tr><td height="3" bgcolor="#5c4dbf" style="height:3px;line-height:0;"></td></tr></table>
            <table width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr><td style="padding:40px 44px 10px;"><img src="https://www.circeetvenus.com/icon.png" width="48" height="48" alt="" style="border-radius:999px;display:block;" /></td></tr>
              <tr><td style="padding:0 44px;">
                <h1 class="cetv-title" style="margin:0;font-family:'Cinzel',Georgia,serif;font-size:26px;font-weight:600;line-height:1.12;color:#1d1d1f;">Reset password</h1>
                <p class="cetv-body" style="margin:18px 0 0;font-size:17px;line-height:26px;color:#494949;">Requested for <span style="color:#1d1d1f;font-weight:500;word-break:break-all;">{{ .Email }}</span></p>
              </td></tr>
              <tr><td style="padding:36px 44px;text-align:center;">
                <table align="center" cellpadding="0" cellspacing="0" border="0"><tr>
                  <td bgcolor="#1d1d1f" style="border-radius:999px;mso-padding-alt:15px 32px;"><a href="{{ .ConfirmationURL }}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:15px 32px;font-family:'DM Sans',-apple-system,sans-serif;font-weight:600;font-size:16px;color:#ffffff;text-decoration:none;border-radius:999px;">Choose new password</a></td>
                </tr></table>
              </td></tr>
              <tr><td style="padding:0 44px 42px;">
                <table width="100%"><tr><td style="border-top:1px solid #ececec;line-height:0;"></td></tr></table>
                <p class="cetv-body" style="margin:26px 0 0;font-size:13px;color:#86868b;line-height:20px;">Link:</p>
                <p style="margin:10px 0 0;font-size:12px;color:#aeaeb2;word-break:break-all;line-height:17px;font-family:'DM Sans',sans-serif;">{{ .ConfirmationURL }}</p>
                <p class="cetv-body" style="margin:24px 0 0;font-size:13px;color:#86868b;line-height:20px;">Not you? Leave this untouched — password stays unchanged.</p>
              </td></tr>
            </table>
          </td>
        </tr>
        <tr><td align="center" style="padding:26px 12px 0;">
          <p class="cetv-body" style="margin:0;font-size:11px;color:#aeaeb2;">Circe et Venus {{ if .SiteURL }}· <a href="{{ .SiteURL }}" style="color:#86868b;text-decoration:none;border-bottom:1px solid #ddd;">{{ .SiteURL }}</a>{{ end }}</p>
        </td></tr>
      </table>
    </td>
  </tr>
</table>
